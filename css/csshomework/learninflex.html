<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 111 0px;
            border: 1px solid rgb(118, 40, 40);
        }

        .flex-item {
            width: 100px;
            height: 100px;
        }

        .item1 {
            background-color: rgb(26, 142, 180);
        }

        .item2 {
            background-color: rgb(7, 36, 90);
        }

        .item3 {
            background-color: rgb(249, 13, 13);
        }
    </style>
</head>

<body>
<h1> CREATE FLEX container </h1>    
/* set the .container flex direction to column and justify content to center */
<div class="flex-container">
    <div class="flex-item item1">Item 1</div>
    <div class="flex-item item2">Item 2</div>
    <div class="flex-item item3">Item 3</div>
</div>

<p> flex box   must have a parent container with display: flex;</p>
</body>
</html>
