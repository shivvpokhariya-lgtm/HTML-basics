<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: 111 0px;
            border: 1px solid rgb(118, 40, 40);
        }

        .flex-item {
            width: 100px;
            height: 100px;
        }

        .item1 {
            background-color: rgb(26, 142, 180);
        }

        .item2 {
            background-color: rgb(7, 36, 90);
        }

        .item3 {
            background-color: rgb(249, 13, 13);
        }
    </style>
</head>

<body>
<h1> CREATE FLEX container </h1>    
<div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; height: 200px; border: 1px solid black;">
    <div style="background-color: rgb(11, 73, 94); width: 100px; height: 100px;">Item 1</div>
    <div style="background-color: lightgreen; width: 100px; height: 100px;">Item 2</div>
    <div style="background-color: lightcoral; width: 100px; height: 100px;">Item 3</div>
<p> flex box   must have a parent container with display: flex;</p>
</body>
</html>
