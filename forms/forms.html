<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Sign up</h1>

    <form action="#" method="post">
        <div>
            <label for="fFname">First name:</label>
            <input type="text" id="firstName" name="firstName" placeholder="Enter first name" required>
        </div>
        <br>
        <div>
            <label for="Phonenumber">Phone number:</label>
           
        <input type="text" id="Phone number" name="Phone number"placeholder="Enter Phone number" required>
</div>
        <br>
        <div>
            <label for="Email">Email:</label>
        
        
               <input type="text" id=" Email" name="Email" placeholder="Enter Email Address" required>
    </div>
        <br>
        <br>
        <div>
            <label for="password">Password:</label>
        
        
               <input type="password" id="password" name="password" placeholder="Enter password" required>
    </div>
        <br>
        <a href="#">Forgot password?</a>
        <br>
        <button type="submit">Submit</button>
    </form>

    <h2>Video element</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/SNFhbKIsnb0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

    <h2>Audio element</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
     
    </audio>

    <h2>Map element</h2>
    <iframe width="600" height="450" style="border:0;" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" title="Location map" src="https://www.google.com/maps?q=Plot+No.+27,+Institutional+Area,+Sector+32,+Gurugram,+Haryana+122002&output=embed"></iframe>

</body>
</html>
